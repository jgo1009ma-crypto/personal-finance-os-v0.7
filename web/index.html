<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Personal Finance OS</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">PF</div><div><strong>Finance OS</strong><span>Personal wealth console</span></div></div>
      <nav id="nav">
        <button class="nav-item active" data-route="overview"><span class="nav-dot"></span>Overview</button>
        <button class="nav-item" data-route="cards"><span class="nav-dot"></span>Tarjetas</button>
        <button class="nav-item" data-route="transactions"><span class="nav-dot"></span>Movimientos</button>
        <button class="nav-item" data-route="debt"><span class="nav-dot"></span>Deuda</button>
        <button class="nav-item" data-route="recurring"><span class="nav-dot"></span>Recurrentes</button>
        <button class="nav-item" data-route="imports"><span class="nav-dot"></span>Estados / Conciliar</button>
        <button class="nav-item" data-route="cashflow"><span class="nav-dot"></span>Cash flow</button>
        <button class="nav-item" data-route="simulator"><span class="nav-dot"></span>Simulador</button>
        <button class="nav-item" data-route="budgets"><span class="nav-dot"></span>Presupuestos</button>
        <button class="nav-item" data-route="copilot"><span class="nav-dot"></span>Copiloto <span class="ai-badge">AI</span></button>
        <button class="nav-item" data-route="reports"><span class="nav-dot"></span>Reportes <span class="soon">next</span></button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span><div><strong>Engine online</strong><span>v0.6 · copilot mode</span></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Abrir navegación">☰</button>
        <div><p class="eyebrow" id="pageEyebrow">PERSONAL FINANCE OS</p><h1 id="pageTitle">Overview</h1></div>
        <div class="top-actions"><div class="asof"><span>Datos al</span><strong id="asOfLabel">—</strong></div><button class="primary" id="quickAdd">+ Movimiento</button></div>
      </header>
      <section id="view" class="view"><div class="loading">Cargando sistema financiero…</div></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
