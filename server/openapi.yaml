openapi: 3.1.0
info:
  title: Personal Finance OS API
  version: 0.8.1
  description: API for personal-finance planning, assets, goals, alerts, forecasting, reconciliation, legacy-tracker review, and the read-only AI financial copilot.
servers:
  - url: /api
paths:
  /v1/health:
    get:
      summary: Runtime status
      responses:
        '200': { description: Service metadata }
  /v1/bootstrap:
    get:
      summary: Bootstrap data for the web application
      responses:
        '200': { description: Cards, snapshots, recurring rules, overrides and transactions }
  /v1/overview:
    get:
      summary: Financial overview at a point in time
      parameters:
        - in: query
          name: asOf
          schema: { type: string, format: date }
      responses:
        '200': { description: Overview }
  /v1/cards:
    get:
      summary: List cards
      parameters:
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
      responses:
        '200': { description: Cards }
    post:
      summary: Add a new card
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCard' }
      responses:
        '201': { description: Card created }
  /v1/cards/{cardId}:
    get:
      summary: Card dashboard data
      parameters: [ { $ref: '#/components/parameters/CardId' } ]
      responses:
        '200': { description: Card dashboard }
    patch:
      summary: Edit card rules/limits/name
      parameters: [ { $ref: '#/components/parameters/CardId' } ]
      responses:
        '200': { description: Card updated }
    delete:
      summary: Archive card without deleting historical data
      parameters: [ { $ref: '#/components/parameters/CardId' } ]
      responses:
        '200': { description: Card archived }
  /v1/cards/{cardId}/restore:
    post:
      summary: Restore an archived card
      parameters: [ { $ref: '#/components/parameters/CardId' } ]
      responses:
        '200': { description: Card restored }
  /v1/cards/{cardId}/project-purchase:
    post:
      summary: Project statement close, legal due date, preferred pay date and MSI schedule
      parameters: [ { $ref: '#/components/parameters/CardId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransaction' }
      responses:
        '200': { description: Purchase projection }
  /v1/transactions:
    get:
      summary: List canonical transactions
      responses:
        '200': { description: Transactions }
    post:
      summary: Create manual/canonical transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransaction' }
      responses:
        '201': { description: Transaction plus projection }
  /v1/debt-plans:
    get:
      summary: List active debt plans
      responses:
        '200': { description: Debt plans }
  /v1/debt-plans/{planId}/simulate-extra-payment:
    post:
      summary: Simulate extraordinary principal payment
      parameters:
        - in: path
          name: planId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, exclusiveMinimum: 0 }
      responses:
        '200': { description: Interest and term comparison }
  /v1/recurring:
    get:
      summary: List recurring baseline rules
      responses:
        '200': { description: Recurring rules }
  /v1/recurring/month:
    get:
      summary: Resolve effective recurring amounts for one month
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      responses:
        '200': { description: Effective period rows }
  /v1/recurring/{recurringId}/overrides/{periodKey}:
    put:
      summary: Override the actual amount for one month or exact occurrence
      parameters:
        - in: path
          name: recurringId
          required: true
          schema: { type: string }
        - in: path
          name: periodKey
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}(-\\d{2})?$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0 }
                note: { type: string }
      responses:
        '200': { description: Override saved }
  /v1/imports:
    get:
      summary: List statement imports
      responses:
        '200': { description: Import history }
    post:
      summary: Upload and parse a PDF/TXT statement for reconciliation
      parameters:
        - in: query
          name: cardId
          required: true
          schema: { type: string }
        - in: query
          name: filename
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string }
      responses:
        '201': { description: Parsed statement with candidate matches }
  /v1/imports/{importId}:
    get:
      summary: Read parsed import and reconciliation state
      parameters:
        - in: path
          name: importId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Import review object }
  /v1/imports/{importId}/rows/{rowId}:
    patch:
      summary: Resolve ambiguous/new row before commit
      parameters:
        - in: path
          name: importId
          required: true
          schema: { type: string }
        - in: path
          name: rowId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [new,ignore,match] }
                transactionId: { type: string }
      responses:
        '200': { description: Updated import review }
  /v1/imports/{importId}/commit:
    post:
      summary: Commit reviewed rows and update official card snapshot
      parameters:
        - in: path
          name: importId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Import committed }
  /v1/preferences:
    get:
      summary: Read forecast and risk preferences
      responses:
        '200': { description: Financial preferences }
    put:
      summary: Update cash-flow, emergency-fund and planning assumptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openingCash: { type: number, minimum: 0 }
                variableSpendTarget: { type: number, minimum: 0 }
                emergencyFundMonths: { type: number, minimum: 0, maximum: 24 }
                emergencyFundBalance: { type: number, minimum: 0 }
                forecastHorizonMonths: { type: integer, minimum: 1, maximum: 36 }
                maxMsiIncomeRatio: { type: number, minimum: 0 }
                maxCreditUtilization: { type: number, minimum: 0 }
      responses:
        '200': { description: Updated preferences }
  /v1/accounts:
    get:
      summary: List asset accounts
      responses:
        '200': { description: Financial accounts }
    post:
      summary: Create an asset account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name,type,balance]
              properties:
                name: { type: string }
                institution: { type: string }
                type: { type: string, enum: [checking,savings,cash,investment,other] }
                balance: { type: number, minimum: 0 }
                includeInNetWorth: { type: boolean }
                isEmergencyFund: { type: boolean }
      responses:
        '201': { description: Account created }
  /v1/accounts/{accountId}:
    patch:
      summary: Update account metadata or balance
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Account updated }
    delete:
      summary: Archive an account
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Account archived }
  /v1/goals:
    get:
      summary: List savings goals
      responses:
        '200': { description: Goals }
    post:
      summary: Create a savings goal
      responses:
        '201': { description: Goal created }
  /v1/goals/{goalId}:
    patch:
      summary: Update a goal
      parameters:
        - in: path
          name: goalId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Goal updated }
    delete:
      summary: Archive a goal
      parameters:
        - in: path
          name: goalId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Goal archived }
  /v1/goals/{goalId}/contributions:
    post:
      summary: Add a contribution to a goal
      parameters:
        - in: path
          name: goalId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Contribution recorded and goal updated }
  /v1/planning-summary:
    get:
      summary: Net worth, emergency fund, goals and deterministic alerts
      parameters:
        - in: query
          name: asOf
          schema: { type: string, format: date }
      responses:
        '200': { description: Planning summary }
  /v1/ui-preferences:
    get:
      summary: Read theme and dashboard personalization
      responses:
        '200': { description: UI preferences }
    put:
      summary: Update theme, dashboard mode and visible widgets
      responses:
        '200': { description: Updated UI preferences }
  /v1/reports/legacy-tracker:
    get:
      summary: Analyze the legacy Finanzas_Personales_v2 tracker as a secondary source
      responses:
        '200': { description: Monthly totals, source concentration, import candidates, budget deltas and source-quality metadata }
  /v1/reports/legacy-tracker/items/{itemId}/import:
    post:
      summary: Confirm one eligible legacy-tracker candidate into the live transaction ledger
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        '201': { description: Imported transaction or duplicate acknowledgement }
  /v1/forecast:
    get:
      summary: Project daily and monthly cash flow plus known debt commitments
      parameters:
        - in: query
          name: asOf
          schema: { type: string, format: date }
        - in: query
          name: months
          schema: { type: integer, minimum: 1, maximum: 36 }
        - in: query
          name: openingCash
          schema: { type: number, minimum: 0 }
        - in: query
          name: variable
          schema: { type: number, minimum: 0 }
      responses:
        '200': { description: Forecast envelope with cash flow, debt timeline, emergency fund and assumptions }
  /v1/scenarios/simulate:
    post:
      summary: Compare baseline with hypothetical purchase, extraordinary debt payment and/or one-time income
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asOf]
              properties:
                asOf: { type: string, format: date }
                horizonMonths: { type: integer, minimum: 1, maximum: 36 }
                openingCash: { type: number, minimum: 0 }
                variableSpendTarget: { type: number, minimum: 0 }
                purchase: { type: object }
                extraDebtPayment: { type: object }
                oneTimeIncome: { type: object }
      responses:
        '200': { description: Baseline vs scenario comparison }
  /v1/copilot/status:
    get:
      summary: Copilot provider/configuration status
      responses:
        '200': { description: Provider, model, read-only mode and configuration status }
  /v1/copilot/sessions:
    get:
      summary: List local copilot sessions
      responses:
        '200': { description: Session summaries }
    post:
      summary: Create a new copilot session
      responses:
        '201': { description: New session }
  /v1/copilot/sessions/{sessionId}:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a copilot session and its messages
      responses:
        '200': { description: Session }
    delete:
      summary: Delete a local copilot conversation
      responses:
        '200': { description: Deletion acknowledgement }
  /v1/copilot/chat:
    post:
      summary: Send a read-only financial question to the copilot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                sessionId: { type: string, format: uuid }
                message: { type: string, minLength: 1 }
      responses:
        '200': { description: Assistant message, provider status and deterministic tool trace }
components:
  parameters:
    CardId:
      in: path
      name: cardId
      required: true
      schema: { type: string }
  schemas:
    CreateCard:
      type: object
      required: [name,issuer,creditLimit,statementCloseDay,dueRule]
      properties:
        name: { type: string }
        issuer: { type: string }
        creditLimit: { type: number, exclusiveMinimum: 0 }
        statementCloseDay: { type: integer, minimum: 1, maximum: 31 }
        dueRule:
          oneOf:
            - type: object
              required: [type,days]
              properties:
                type: { const: days_after_close }
                days: { type: integer, minimum: 1 }
            - type: object
              required: [type,day]
              properties:
                type: { const: fixed_day }
                day: { type: integer, minimum: 1, maximum: 31 }
        personalPayDay: { type: integer, minimum: 1, maximum: 31 }
        apr: { type: number, minimum: 0 }
        last4: { type: string, pattern: '^\\d{4}$' }
    CreateTransaction:
      type: object
      required: [cardId,date,description,amount]
      properties:
        cardId: { type: string }
        date: { type: string, format: date }
        description: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        kind: { type: string, enum: [purchase,refund,payment,fee,interest,cash_advance,subscription] }
        financing: { type: string, enum: [regular,msi,interest_plan,revolver] }
        category: { type: string }
        installments: { type: integer, minimum: 2 }
        apr: { type: number, minimum: 0 }
